name: Build Android APK from HTML Demo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Find HTML demo
        id: html
        shell: bash
        run: |
          HTML_FILE="$(find . -maxdepth 1 -type f -iname '*.html' -print -quit)"
          if [ -z "$HTML_FILE" ]; then
            echo "No .html demo file found in the repository root. Upload Land_Bangla_Orchid_Interactive_Demo.html to the root first."
            exit 1
          fi
          echo "file=$HTML_FILE" >> "$GITHUB_OUTPUT"
          echo "Using HTML file: $HTML_FILE"

      - name: Create Flutter project
        run: flutter create land_bangla_orchid --platforms=android --org com.landbangla

      - name: Add HTML demo and Flutter WebView code
        shell: bash
        run: |
          mkdir -p land_bangla_orchid/assets
          cp "${{ steps.html.outputs.file }}" land_bangla_orchid/assets/index.html
          cat > land_bangla_orchid/pubspec.yaml <<'PUBSPEC'
          name: land_bangla_orchid
          description: Land Bangla Orchid apartment management HTML demo app.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.4.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.10.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/index.html
          PUBSPEC

          cat > land_bangla_orchid/lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const LandBanglaOrchidApp());
          }

          class LandBanglaOrchidApp extends StatefulWidget {
            const LandBanglaOrchidApp({super.key});

            @override
            State<LandBanglaOrchidApp> createState() => _LandBanglaOrchidAppState();
          }

          class _LandBanglaOrchidAppState extends State<LandBanglaOrchidApp> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFFFFFFFF))
                ..loadFlutterAsset('assets/index.html');
            }

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Land Bangla Orchid',
                theme: ThemeData(colorSchemeSeed: const Color(0xFF087F5B)),
                home: Scaffold(
                  appBar: AppBar(title: const Text('Land Bangla Orchid')),
                  body: WebViewWidget(controller: controller),
                ),
              );
            }
          }
          DART

      - name: Get dependencies
        working-directory: land_bangla_orchid
        run: flutter pub get

      - name: Build release APK
        working-directory: land_bangla_orchid
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: land-bangla-orchid-apk
          path: land_bangla_orchid/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
