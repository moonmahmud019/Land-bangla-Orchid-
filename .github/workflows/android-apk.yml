name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create and build Flutter app
        run: |
          flutter create land_bangla_orchid --platforms=android --org com.landbangla
          cd land_bangla_orchid
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: land-bangla-orchid-apk
          path: land_bangla_orchid/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
